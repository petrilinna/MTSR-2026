        vocabulary_mapping:
          vocabulary: AGROVOC
          label: wind speed
          uri: http://aims.fao.org/aos/agrovoc/c_29582
          definition: null
          match_type: exact
        standard_mapping:
          semantic_role: wind speed
          uri: https://smartdatamodels.org/dataModel.Weather/windSpeed

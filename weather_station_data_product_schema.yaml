$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:semantic-agri:weather-station-observation-schema
title: Reusable semantic schema for a weather-station JSON record array
description: Reusable schema for the observed weather-station JSON field structure,
  enriched with semantic mappings and without instance measurement values.
type: array
items:
  type: object
  properties:
    ts:
      description: Observation timestamp encoded as an integer Unix time in the source.
      type: integer
      x-semantic:
        vocabulary_search_term: timestamp
        vocabulary_mapping: null
        standard_mapping:
          semantic_role: result time
          uri: http://www.w3.org/ns/sosa/resultTime
          status: check
          basis: 'CHECK: source field name suggests timestamp, but encoding semantics
            are supplied by dataset context.'
        unit: null
    tz_offset:
      description: Source time-zone offset value associated with the timestamp; unit
        is not explicit.
      type: integer
      x-semantic:
        vocabulary_search_term: time zone offset
        vocabulary_mapping: null
        standard_mapping: null
        unit:
          original_unit: null
          normalized_unit: 'CHECK: second'
          standardized_label: 'CHECK: second'
          identifier: null
          status: check
          note: 'CHECK: time-zone offset unit is not explicit.'
    bar_trend:
      description: Barometric-pressure trend indicator/value; source scale is not
        documented.
      type: number
      x-semantic:
        vocabulary_search_term: barometric pressure trend
        vocabulary_mapping:
          vocabulary: AGROVOC
          label: atmospheric pressure
          uri: http://aims.fao.org/aos/agrovoc/c_693
          definition: 'The gravitational force exerted by a column of air extending
            from the point of concern to the outer limits of the atmosphere. Unit
            of measurement: kilopascal (kPa).'
          match_type: exact
        standard_mapping:
          semantic_role: pressure tendency
          uri: https://smartdatamodels.org/dataModel.Weather/pressureTendency
          status: supported
          basis: DEMETER AgriProperty includes pressure tendency
        unit:
          original_unit: null
          normalized_unit: null
          standardized_label: null
          identifier: null
          status: not_available
          note: Pressure-trend scale/unit is not encoded.
    bar:
      description: Barometric/atmospheric pressure reading.
      type: number
      x-semantic:
        vocabulary_search_term: barometric pressure
        vocabulary_mapping:
          vocabulary: AGROVOC
          label: atmospheric pressure
          uri: http://aims.fao.org/aos/agrovoc/c_693
          definition: 'The gravitational force exerted by a column of air extending
            from the point of concern to the outer limits of the atmosphere. Unit
            of measurement: kilopascal (kPa).'
          match_type: exact
        standard_mapping:
          semantic_role: atmospheric pressure
          uri: https://smartdatamodels.org/dataModel.Weather/atmosphericPressure
          status: supported
          basis: DEMETER AgriProperty includes this weather property; source field
            bar is barometric pressure
        unit:
          original_unit: null
          normalized_unit: 'CHECK: inch of mercury'
          standardized_label: 'CHECK: inch of mercury'
          identifier: null
          status: check
          note: 'CHECK: pressure unit is not encoded.'
    temp_in:
      description: Indoor temperature reading.
      type: number
      x-semantic:
        vocabulary_search_term: indoor temperature
        vocabulary_mapping:
          vocabulary: AGROVOC
          label: temperature
          uri: http://aims.fao.org/aos/agrovoc/c_7657
          definition: Temperature is a physical quantity that quantitatively expresses
            the attribute of hotness or coldness.
          match_type: exact
        standard_mapping:
          semantic_role: temperature
          uri: https://smartdatamodels.org/dataModel.Weather/temperature
          status: check
          basis: indoor temperature naming; precise feature of interest is not supplied
        unit:
          original_unit: in
          normalized_unit: inch
          standardized_label: inch
          identifier: null
          status: supported
          note: Unit token is interpreted as inch because a paired millimetre field
            exists; rate fields do not encode the time denominator.
    hum_in:
      description: Indoor humidity reading.
      type: number
      x-semantic:
        vocabulary_search_term: indoor relative humidity
        vocabulary_mapping:
          vocabulary: AGROVOC
          label: humidity
          uri: http://aims.fao.org/aos/agrovoc/c_3689
          definition: Amount of water vapor in the air.
          match_type: exact
        standard_mapping:
          semantic_role: humidity
          uri: https://saref.etsi.org/saref4agri/AmbientHumidity
          status: check
          basis: source abbreviation hum; exact relative/absolute humidity type is
            not stated
        unit:
          original_unit: in
          normalized_unit: inch
          standardized_label: inch
          identifier: null
          status: supported
          note: Unit token is interpreted as inch because a paired millimetre field
            exists; rate fields do not encode the time denominator.
    temp_out:
      description: Outdoor temperature reading.
      type: number
      x-semantic:
        vocabulary_search_term: outdoor temperature
        vocabulary_mapping:
          vocabulary: AGROVOC
          label: temperature
          uri: http://aims.fao.org/aos/agrovoc/c_7657
          definition: Temperature is a physical quantity that quantitatively expresses
            the attribute of hotness or coldness.
          match_type: exact
        standard_mapping:
          semantic_role: air/ambient temperature
          uri: https://saref.etsi.org/saref4agri/AirTemperature
          status: check
          basis: outdoor temperature naming; source does not explicitly say air
        unit:
          original_unit: null
          normalized_unit: 'CHECK: degree Fahrenheit'
          standardized_label: 'CHECK: degree Fahrenheit'
          identifier: null
          status: check
          note: 'CHECK: temperature unit is not explicit in the field name.'
    wind_speed:

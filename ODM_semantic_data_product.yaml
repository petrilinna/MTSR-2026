  standards:
  - rank: 1
    standard: DEMETER Agriculture Information Model (AIM) 3.0
    role: Selected overarching agricultural semantic model; it reuses/alines SAREF4AGRI,
      SOSA/SSN, GeoSPARQL and QUDT.
  - rank: 2
    standard: SOSA/SSN
    role: Applied to camera/sensor, observations, observed properties, results and
      feature-of-interest semantics.
  - rank: 3
    standard: GeoSPARQL
    role: Applied to spatial geometry, coordinates, bounding boxes and CRS-related
      spatial description.
  - rank: 4
    standard: QUDT
    role: Applied to machine-readable units where verified unit identifiers are available.
  units:
  - fields:
    - latitude
    - longitude
    - yaw
    - pitch
    - roll
    - omega
    - phi
    - kappa
    original: degrees (implicit/field semantics)
    normalized: degree
    standard_label: Degree
    uri: http://qudt.org/vocab/unit/DEG
  - fields:
    - altitude
    - point-cloud Z
    - gps_xy_stddev
    - gps_z_stddev
    - average_point_spacing
    original: metre (supported by CRS/metadata; image altitude unit is CHECK)
    normalized: m
    standard_label: Meter
    uri: http://qudt.org/vocab/unit/M
  - fields:
    - exposure_time
    original: seconds (numeric camera exposure convention; CHECK)
    normalized: s
    standard_label: Second
    uri: http://qudt.org/vocab/unit/SEC
  - fields:
    - speed_x
    - speed_y
    - speed_z
    original: not explicitly stated
    normalized: 'CHECK: m/s'
    standard_label: Meter per Second
    uri: http://qudt.org/vocab/unit/M-PER-SEC
  - fields:
    - boundary_area
    original: square units; CRS is metre-based
    normalized: m²
    standard_label: Square Meter
    uri: http://qudt.org/vocab/unit/M2
  - fields:
    - width
    - height
    - exif_width
    - exif_height
    original: pixels
    normalized: pixel
    standard_label: pixel
    uri: null
  - fields:
    - density
    original: points per square CRS unit
    normalized: points/m²
    standard_label: points per square metre
    uri: null
  vocabulary_enrichment:
    note: Vocabulary searches were performed on source-field concepts. Only semantically
      suitable returned concepts are asserted; unsuitable or absent results are left
      unmapped.
    selected:
    - fields:
      - latitude
      vocabulary: AGROVOC
      label: latitude
      uri: http://aims.fao.org/aos/agrovoc/c_4222
      definition: Imaginary lines parallel to the Equator used to measure north/south
        position.
    - fields:
      - longitude
      vocabulary: AGROVOC
      label: longitude
      uri: http://aims.fao.org/aos/agrovoc/c_52bebf31
      definition: Imaginary north-south lines used to measure east/west position from
        a reference meridian.
    - fields:
      - altitude
      vocabulary: AGROVOC
      label: altitude
      uri: http://aims.fao.org/aos/agrovoc/c_316
      definition: Distance above sea level.
    - fields:
      - camera_make
      - camera_model
      - camera_projection
      vocabulary: AGROVOC
      label: cameras
      uri: http://aims.fao.org/aos/agrovoc/c_e5fb8acb
      definition: Instrument with lens, shutter and image sensor used to capture and
        store images.
    - fields:
      - speed_x
      - speed_y
      - speed_z
      vocabulary: AGROVOC
      label: speed
      uri: http://aims.fao.org/aos/agrovoc/c_24248
      definition: Magnitude of change of position; distance divided by time.
    unmapped_after_search:
    - filename
    - image width
    - image height
    - RGB image
    - exposure time
    - ISO speed
    - point cloud
    - capture UUID
    - f-number
    - radiometric calibration
    - black level
    - gain
    - vignetting
    - irradiance
    - GPS standard deviation
    - Brown camera projection
    - focal ratio
    - camera distortion coefficients
    - band index
    rejected:
    - field: orientation
      reason: Returned AGROVOC orientation definition is too general and does not
        specifically identify EXIF/camera orientation.
    - field: utc_time
      reason: Returned generic time concept is not specific enough to assert as a
        semantic mapping.
    - field: boundary_area
      reason: Search for area returned no exact AGROVOC concept matching generic geometric
        area; no mapping forced.
  semantic_field_roles:
    camera_make: sosa:Sensor / saref:Device descriptive attribute
    camera_model: sosa:Sensor / saref:Device descriptive attribute
    latitude: GeoSPARQL/WGS84 spatial coordinate
    longitude: GeoSPARQL/WGS84 spatial coordinate
    altitude: spatial/elevation result
    utc_time: 'sosa:resultTime or sosa:phenomenonTime (CHECK: exact role cannot be
      distinguished from source)'
    band_name: observable/result-band descriptor
    capture_uuid: observation/capture identifier
    point_cloud_geometry: geo:Geometry
    crs: spatial reference system identifier
    boundary: geo:Geometry
    camera: sosa:Sensor
    image_capture: sosa:Observation (semantic modeling choice)
  grounding_validation:
    verified:
    - 11 images
    - DJI FC6360
    - 1600x1300
    - RGB
    - capture timestamps
    - coordinate ranges
    - camera calibration values
    - ODM 3.4.0
    - Entwine 2.2.0
    - EPSG:32634
    - 628062 points
    - point-cloud bounds
    - 3503.072758 boundary area
    - 0.4723316984 average point spacing
    - 4.482350521 density
    - 2648886-byte referenced LAZ
    check_values:
    - Dataset title and agricultural/remote-sensing theme are descriptive proposals
      rather than explicit source metadata.
    - Image altitude and exposure-time unit interpretations should be confirmed.
    - speed_x/y/z as m/s should be confirmed.
    - utc_time is normalized from Unix epoch milliseconds; its precise semantic role
      (capture/phenomenon/result time) should be confirmed.
    removed_or_not_asserted:
    - No farm, crop, field/parcel, farmer, owner, publisher, license, access-rights
      or purpose was inferred.
    - No vocabulary URI was forced for fields where search results were absent or
      semantically unsuitable.
  provenance:
    source_dataset: odm_bundle.txt
    generated_elements:
      DCAT-AP metadata: source extraction plus CHECK-marked descriptive proposals
      semantic roles: DEMETER AIM / SOSA-SSN / GeoSPARQL knowledge base
      unit identifiers: QUDT identifiers
      controlled vocabulary mappings: connected vocabulary search service

  standards:
    candidate_ranking:
    - rank: 1
      standard: DEMETER Agriculture Information Model (AIM) 3.0 — AgriSystem + AgriProperty
      relevance: highest
      reason: The supplied AIM profile contains saref4agri:WeatherStation and weather/agricultural measurement properties,
        and it reuses SAREF/SAREF4AGRI, SOSA/SSN, QUDT/other unit models, and Smart Data Models.
      source_files:
      - demeterAgriProfile.txt
      - agriSystem.txt
      - agriProperty.txt
      - cross-domain.txt
    - rank: 2
      standard: W3C/OGC SOSA/SSN
      relevance: high
      reason: 'Provides the generic sensor-observation structure: Sensor, Observation, observedProperty, result, resultTime
        and FeatureOfInterest, but is not agriculture-specific.'
      source_files:
      - Semantic Sensor Network Ontology.pdf
      - cross-domain.txt
    - rank: 3
      standard: SAREF4AGRI
      relevance: high but narrower
      reason: Provides agriculture-specific concepts such as WeatherStation, SoilMoisture, SoilTemperature and Precipitation.
        It is reused within DEMETER AIM, so it is applied through the selected AIM profile rather than as a competing standalone
        model.
      source_files:
      - saref4agri.ttl
      - agriSystem.txt
      - agriProperty.txt
    selected:
      standard: DEMETER Agriculture Information Model (AIM) 3.0
      version: '3.0'
      profiles:
      - AgriSystem
      - AgriProperty
      - Cross-Domain
      selection_reason: Best fit to an agricultural weather-station dataset because it supplies the domain-specific weather-station
        class and integrates SOSA/SSN observation semantics.
      applied_elements:
        system_class:
          label: Weather station
          uri: https://saref.etsi.org/saref4agri/WeatherStation
        observation_class:
          label: Observation
          uri: http://www.w3.org/ns/sosa/Observation
        observed_property:
          uri: http://www.w3.org/ns/sosa/observedProperty
        result:
          uri: http://www.w3.org/ns/sosa/hasResult
        result_time:
          uri: http://www.w3.org/ns/sosa/resultTime
      modeling_note: Each measurable source field can be represented as a distinct SOSA observation sharing the record timestamp.
        No station instance identifier, feature of interest, or deployment location is asserted because the source does not
        provide them.
